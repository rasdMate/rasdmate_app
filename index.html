<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل رصد ميت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.3);
            max-width: 650px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 4em;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.8em;
            font-weight: 700;
        }
        
        .version-badge {
            display: inline-block;
            background: #f0f0f0;
            padding: 8px 20px;
            border-radius: 20px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 35px;
            font-size: 0.95em;
        }
        
        .loading {
            color: #999;
            font-size: 1.1em;
            margin: 30px 0;
        }
        
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 40px;
            background: linear-gradient(135deg, #0078D4 0%, #005a9e 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            margin: 20px 0;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }
        
        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .file-info {
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
        }
        
        .error {
            color: #e74c3c;
            background: #fee;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>RasdMate</h1>
        
        <div class="version-badge" id="version">
            جاري التحميل...
        </div>
        
        <div id="download-section">
            <p class="loading">⏳ جاري البحث عن آخر إصدار...</p>
        </div>
    </div>
    
    <script>
        // معلومات الـ repo (غيّرها حسب مشروعك)
        const GITHUB_OWNER = 'rasdMate';
        const GITHUB_REPO = 'rasdmate_app';
        
        // جلب آخر إصدار من GitHub API
        async function getLatestRelease() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases/latest`
                );
                
                if (!response.ok) {
                    throw new Error('فشل في جلب الإصدار');
                }
                
                const release = await response.json();
                displayRelease(release);
                
            } catch (error) {
                console.error('خطأ:', error);
                document.getElementById('download-section').innerHTML = `
                    <div class="error">
                        ⚠️ عذراً، حدث خطأ في جلب آخر إصدار.<br>
                        الرجاء المحاولة لاحقاً أو زيارة صفحة 
                        <a href="https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/releases" 
                           target="_blank" 
                           style="color: #0078D4;">
                            Releases
                        </a>
                    </div>
                `;
            }
        }
        
        function displayRelease(release) {
            // عرض رقم الإصدار
            document.getElementById('version').innerHTML = 
                `⚡ الإصدار ${release.tag_name} - ${formatDate(release.published_at)}`;
            
            // البحث عن ملف .exe في الـ assets
            const exeFile = release.assets.find(asset => 
                asset.name.endsWith('.exe')
            );
            
            if (exeFile) {
                // عرض زر التحميل
                document.getElementById('download-section').innerHTML = `
                    <a href="${exeFile.browser_download_url}" 
                       class="download-btn"
                       download>
                        <span style="font-size: 1.5em;">🪟</span>
                        <span>تحميل لنظام Windows</span>
                    </a>
                    
                    <div class="file-info">
                        📦 ${exeFile.name}<br>
                        💾 الحجم: ${formatFileSize(exeFile.size)}
                    </div>
                `;
            } else {
                // في حالة عدم وجود ملف exe
                document.getElementById('download-section').innerHTML = `
                    <div class="error">
                        ⚠️ لم يتم العثور على ملف Windows في هذا الإصدار.<br>
                        <a href="${release.html_url}" 
                           target="_blank" 
                           style="color: #0078D4;">
                            عرض جميع الملفات
                        </a>
                    </div>
                `;
            }
        }
        
        // تنسيق التاريخ
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'اليوم';
            if (diffDays === 1) return 'أمس';
            if (diffDays < 7) return `قبل ${diffDays} أيام`;
            if (diffDays < 30) return `قبل ${Math.floor(diffDays / 7)} أسابيع`;
            if (diffDays < 365) return `قبل ${Math.floor(diffDays / 30)} أشهر`;
            return date.toLocaleDateString('ar-SA');
        }
        
        // تنسيق حجم الملف
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        // تشغيل عند تحميل الصفحة
        getLatestRelease();
    </script>
</body>
</html>
